<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>That request didn't make sense. · Shuffl</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { --ink:#0A0A0A; --muted:#6B6B6B; --hairline:#E5E5E5; --burgundy:#7B1622; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:var(--ink); font:18px/1.55 "Helvetica Now Display","Helvetica Neue",Helvetica,"Inter Tight",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    main { max-width:1320px; margin:0 auto; padding:clamp(40px,7vw,96px) clamp(16px,3.5vw,56px); min-height:100vh; display:flex; flex-direction:column; }
    .wordmark { font-weight:700; font-size:36px; letter-spacing:-0.06em; color:var(--ink); text-decoration:none; }
    .eyebrow { margin:clamp(48px,8vw,120px) 0 16px; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
    h1 { margin:0 0 16px; font-size:clamp(44px,8vw,104px); font-weight:700; letter-spacing:-0.045em; line-height:0.95; }
    p { margin:0; max-width:52ch; color:#4A4A4A; }
    .actions { margin-top:40px; padding-top:24px; border-top:1px solid var(--ink); display:flex; gap:16px; flex-wrap:wrap; }
    .btn { display:inline-block; padding:13px 24px; border-radius:6px; text-decoration:none; font-size:16px; letter-spacing:-0.015em; }
    .btn-primary { background:var(--burgundy); color:#fff; border:1px solid var(--burgundy); }
    .btn-primary:hover { background:#63111B; }
    .btn-ghost { color:var(--ink); border:1px solid var(--ink); }
    .btn-ghost:hover { background:var(--ink); color:#fff; }
    footer { margin-top:auto; padding-top:40px; font-size:13px; color:var(--muted); display:flex; justify-content:space-between; gap:24px; }
  </style>
</head>
<body>
  <main>
    <a class="wordmark" href="/">shuffl</a>
    <p class="eyebrow">Error 400</p>
    <h1>That request didn't make sense.</h1>
    <p>Something in the address was malformed. Start again from the home page.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to home</a>
      <a class="btn btn-ghost" href="/cards">Browse cards</a>
    </div>
    <footer><span>shuffl</span><span>a little more rewarding.</span></footer>
  </main>
</body>
</html>
